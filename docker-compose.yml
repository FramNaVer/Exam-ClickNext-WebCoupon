version: '3.8'

services:
  # ─── Database ───────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: coupon_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - coupon_network

  # ─── Backend (Express) ──────────────────────────────────
  # backend:
  #   build: ./backend
  #   container_name: coupon_backend
  #   restart: unless-stopped
  #   env_file: ./backend/.env
  #   ports:
  #     - '8080:8080'
  #   depends_on:
  #     - db
  #   networks:
  #     - coupon_network

  # ─── Frontend (Nuxt) ────────────────────────────────────
  # frontend:
  #   build: ./nuxt-app
  #   container_name: coupon_frontend
  #   restart: unless-stopped
  #   ports:
  #     - '3000:3000'
  #   depends_on:
  #     - backend
  #   networks:
  #     - coupon_network

volumes:
  postgres_data:

networks:
  coupon_network:
    driver: bridge
