version: '3.8'

services:
  # ─── Backend (Express) ──────────────────────────────────
  backend:
    build: ./backend
    container_name: coupon_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      PORT: 8080
    ports:
      - '8080:8080'
    networks:
      - coupon_network

  # ─── Frontend (Nuxt) ────────────────────────────────────
  frontend:
    build: ./nuxt-app
    container_name: coupon_frontend
    restart: unless-stopped
    environment:
      NUXT_PUBLIC_API_BASE_URL: ${NUXT_PUBLIC_API_BASE_URL:-http://backend:8080}
    ports:
      - '3000:3000'
    depends_on:
      - backend
    networks:
      - coupon_network

networks:
  coupon_network:
    driver: bridge
